<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TransportAdmin - Connexion</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="assets/css/style.css" rel="stylesheet"/>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet"/>
</head>
<body>
  <!-- Loader -->
  <div id="app-loader" class="loader-overlay hidden">
    <div class="loader-spinner"></div>
  </div>

  <div class="auth-container">
    <!-- Section gauche -->
    <div class="auth-left">
      <div class="auth-image-placeholder">
        <div>
          <i class="fas fa-sign-in-alt fa-4x"></i>
          <h2>Bienvenue</h2>
        </div>
      </div>
    </div>

    <!-- Section droite -->
    <div class="auth-right">
      <div class="auth-form">
        <div class="auth-header">
          <h1 class="auth-title">
            <i class="fas fa-route" style="color: var(--primary-orange);"></i>
            Yael Connexion
          </h1>
          <p class="auth-subtitle">Accédez à votre tableau de bord</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <i class="fas fa-user form-icon"></i>
            <input type="text" name="email" id="login-email" class="form-input" placeholder=" " required>
            <label class="form-label" for="login-email">email</label>
          </div>

          <div class="form-group">
            <i class="fas fa-lock form-icon"></i>
            <input type="password" name="password" id="login-password" class="form-input" placeholder=" " required>
            <label class="form-label" for="login-password">Mot de passe</label>
          </div>

          <div class="flex justify-between items-center mb-4">
            <label class="flex items-center">
              <input type="checkbox" name="remember" style="margin-right: 8px;">
              <span style="font-size: 14px; color: var(--dark-gray);">Se souvenir de moi</span>
            </label>
            <a href="#" class="auth-link" style="font-size: 14px;">Mot de passe oublié ?</a>
          </div>
          <br/>

          <button type="submit" id="login-btn" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i> Se connecter
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>

  <!-- App scripts -->
  <script src="assets/js/config.js"></script>
  <script src="services/http.js"></script>
  <script src="services/auth.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
